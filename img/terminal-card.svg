<svg width="860" height="510" viewBox="0 0 860 510" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="860" y2="490" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="1" stop-color="#161B22"/>
    </linearGradient>
    <linearGradient id="topGlow" x1="0" y1="0" x2="860" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#00D9FF" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#00D9FF" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#A855F7" stop-opacity="1"/>
      <stop offset="0.8" stop-color="#00D9FF" stop-opacity="0.9"/>
      <stop offset="1"   stop-color="#00D9FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sideGlow" x1="0" y1="0" x2="0" y2="490" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#00D9FF" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#A855F7" stop-opacity="0.3"/>
      <stop offset="1"   stop-color="#00D9FF" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="titleBarGrad" x1="0" y1="0" x2="860" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#161B22"/>
      <stop offset="0.5" stop-color="#1C2128"/>
      <stop offset="1" stop-color="#161B22"/>
    </linearGradient>
    <linearGradient id="emailGrad" x1="0" y1="0" x2="254" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1C3A6E"/>
      <stop offset="1" stop-color="#1C4A8F"/>
    </linearGradient>
    <!-- Shimmer sweep gradient -->
    <linearGradient id="shimmer_t" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="white" stop-opacity="0"/>
      <stop offset="0.5" stop-color="white" stop-opacity="0.05"/>
      <stop offset="1"   stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <!-- Clip for shimmer -->
    <clipPath id="clip_t">
      <rect width="860" height="490" rx="12"/>
    </clipPath>
    <!-- LIVE glow filter -->
    <filter id="liveGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Shadow blur -->
    <filter id="shadowBlur" x="-20%" y="-20%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- ══════════════════════════════════════════ -->
  <!-- SHADOW (animated below the floating card)  -->
  <!-- ══════════════════════════════════════════ -->
  <ellipse cx="430" cy="500" rx="380" ry="12" fill="#000000" opacity="0.5" filter="url(#shadowBlur)">
    <animate attributeName="cy"      values="500;506;500"   dur="4.5s" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4,0,0.6,1;0.4,0,0.6,1" repeatCount="indefinite"/>
    <animate attributeName="ry"      values="12;6;12"       dur="4.5s" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4,0,0.6,1;0.4,0,0.6,1" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.2;0.5"   dur="4.5s" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4,0,0.6,1;0.4,0,0.6,1" repeatCount="indefinite"/>
  </ellipse>

  <!-- ══════════════════════════════════════════ -->
  <!-- FLOATING CARD WRAPPER                      -->
  <!-- ══════════════════════════════════════════ -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 0,-5; 0,0" dur="4.5s" keyTimes="0;0.5;1"
      calcMode="spline" keySplines="0.4,0,0.6,1;0.4,0,0.6,1"
      repeatCount="indefinite"/>

    <!-- Card background -->
    <rect width="860" height="490" rx="12" fill="url(#bgGrad)"/>
    <rect x="0.75" y="0.75" width="858.5" height="488.5" rx="11.5" fill="none" stroke="#30363D" stroke-width="1.5"/>
    <rect x="0.75" y="0.75" width="858.5" height="488.5" rx="11.5" fill="none" stroke="url(#sideGlow)" stroke-width="1"/>
    <!-- Top accent glow line -->
    <rect x="0" y="0" width="860" height="3" rx="1.5" fill="url(#topGlow)"/>

    <!-- Title Bar -->
    <rect x="1" y="1" width="858" height="44" rx="11" fill="url(#titleBarGrad)"/>
    <rect x="1" y="34" width="858" height="11" fill="#161B22"/>
    <line x1="1" y1="44" x2="859" y2="44" stroke="#21262D" stroke-width="1"/>

    <!-- Window controls -->
    <circle cx="28" cy="22" r="6.5" fill="#FF5F57"/>
    <circle cx="50" cy="22" r="6.5" fill="#FEBC2E"/>
    <circle cx="72" cy="22" r="6.5" fill="#28C840"/>

    <!-- Title -->
    <text x="430" y="27" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="13" fill="#6E7681">tengkuzainul@github ~ SYSTEM.INFO</text>

    <!-- LIVE indicator with pulse ring -->
    <circle cx="810" cy="22" r="12" fill="#39D353" fill-opacity="0.1">
      <animate attributeName="r" values="8;15;8" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0.15;0;0.15" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="810" cy="22" r="5.5" fill="#39D353" filter="url(#liveGlow)"/>
    <text x="821" y="27" font-family="'Courier New', Courier, monospace" font-size="11.5" fill="#39D353" filter="url(#liveGlow)">LIVE</text>

    <!-- Email badge -->
    <rect x="20" y="58" width="254" height="26" rx="5" fill="url(#emailGrad)"/>
    <rect x="20" y="58" width="254" height="26" rx="5" fill="none" stroke="#1F6FEB" stroke-width="1"/>
    <text x="147" y="75.5" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="12" font-weight="bold" fill="#79C0FF">tengkuzainula04@gmail.com</text>

    <!-- Separator 1 -->
    <line x1="20" y1="98" x2="840" y2="98" stroke="#21262D" stroke-width="1"/>

    <!-- ═══ IDENTITY SECTION ═══ -->
    <text x="30" y="120" font-family="'Courier New', Courier, monospace" font-size="13" fill="#6E7681">Subject</text>
    <line x1="105" y1="116" x2="640" y2="116" stroke="#21262D" stroke-width="1" stroke-dasharray="3,7"/>
    <text x="840" y="120" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="600" fill="#E6EDF3">Tengku Zainul</text>

    <text x="30" y="142" font-family="'Courier New', Courier, monospace" font-size="13" fill="#6E7681">Role</text>
    <line x1="72" y1="138" x2="640" y2="138" stroke="#21262D" stroke-width="1" stroke-dasharray="3,7"/>
    <text x="840" y="142" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="13" fill="#58A6FF">Junior Web Developer</text>

    <text x="30" y="164" font-family="'Courier New', Courier, monospace" font-size="13" fill="#6E7681">Origin</text>
    <line x1="95" y1="160" x2="640" y2="160" stroke="#21262D" stroke-width="1" stroke-dasharray="3,7"/>
    <text x="840" y="164" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="13" fill="#E6EDF3">Indonesia</text>

    <text x="30" y="186" font-family="'Courier New', Courier, monospace" font-size="13" fill="#6E7681">Education</text>
    <line x1="120" y1="182" x2="640" y2="182" stroke="#21262D" stroke-width="1" stroke-dasharray="3,7"/>
    <text x="840" y="186" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="13" fill="#E6EDF3">S1 Sistem Informasi</text>

    <text x="30" y="208" font-family="'Courier New', Courier, monospace" font-size="13" fill="#6E7681">Status</text>
    <line x1="95" y1="204" x2="640" y2="204" stroke="#21262D" stroke-width="1" stroke-dasharray="3,7"/>
    <text x="840" y="208" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="13" fill="#39D353">Building &#x2022; Learning &#x2022; Growing</text>

    <text x="30" y="230" font-family="'Courier New', Courier, monospace" font-size="13" fill="#6E7681">Toolchain</text>
    <line x1="120" y1="226" x2="640" y2="226" stroke="#21262D" stroke-width="1" stroke-dasharray="3,7"/>
    <text x="840" y="230" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="13" fill="#E6EDF3">VS Code, Git, Laragon, Figma</text>

    <!-- Separator 2 -->
    <line x1="20" y1="243" x2="840" y2="243" stroke="#21262D" stroke-width="1"/>

    <!-- ═══ TECH STACK SECTION ═══ -->
    <text x="30" y="264" font-family="'Courier New', Courier, monospace" font-size="13" fill="#6E7681">Core.Lang</text>
    <line x1="120" y1="260" x2="640" y2="260" stroke="#21262D" stroke-width="1" stroke-dasharray="3,7"/>
    <text x="840" y="264" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="13" fill="#E6EDF3">PHP, JavaScript, HTML, CSS</text>

    <text x="30" y="286" font-family="'Courier New', Courier, monospace" font-size="13" fill="#6E7681">Core.Frontend</text>
    <line x1="150" y1="282" x2="640" y2="282" stroke="#21262D" stroke-width="1" stroke-dasharray="3,7"/>
    <text x="840" y="286" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="13" fill="#D2A8FF">Tailwind CSS, Alpine.js</text>

    <text x="30" y="308" font-family="'Courier New', Courier, monospace" font-size="13" fill="#6E7681">Core.Backend</text>
    <line x1="143" y1="304" x2="640" y2="304" stroke="#21262D" stroke-width="1" stroke-dasharray="3,7"/>
    <text x="840" y="308" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="13" fill="#D2A8FF">Laravel, Livewire</text>

    <text x="30" y="330" font-family="'Courier New', Courier, monospace" font-size="13" fill="#6E7681">Core.Database</text>
    <line x1="152" y1="326" x2="640" y2="326" stroke="#21262D" stroke-width="1" stroke-dasharray="3,7"/>
    <text x="840" y="330" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="13" fill="#E6EDF3">MySQL, MariaDB, Supabase</text>

    <text x="30" y="352" font-family="'Courier New', Courier, monospace" font-size="13" fill="#6E7681">Core.Stack</text>
    <line x1="127" y1="348" x2="640" y2="348" stroke="#21262D" stroke-width="1" stroke-dasharray="3,7"/>
    <text x="840" y="352" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="13" fill="#58A6FF">TALL Stack</text>

    <!-- Separator 3 -->
    <line x1="20" y1="364" x2="840" y2="364" stroke="#21262D" stroke-width="1"/>

    <!-- ═══ CONTACT SECTION ═══ -->
    <text x="30" y="383" font-family="'Courier New', Courier, monospace" font-size="11" fill="#8B949E">Contact</text>

    <text x="30" y="401" font-family="'Courier New', Courier, monospace" font-size="12" fill="#6E7681">Grid.Mail</text>
    <line x1="105" y1="397" x2="640" y2="397" stroke="#21262D" stroke-width="1" stroke-dasharray="3,7"/>
    <text x="840" y="401" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="12" fill="#58A6FF">tengkuzainula04@gmail.com</text>

    <text x="30" y="419" font-family="'Courier New', Courier, monospace" font-size="12" fill="#6E7681">Grid.LinkedIn</text>
    <line x1="135" y1="415" x2="640" y2="415" stroke="#21262D" stroke-width="1" stroke-dasharray="3,7"/>
    <text x="840" y="419" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="12" fill="#58A6FF">tengkuzainull</text>

    <text x="30" y="437" font-family="'Courier New', Courier, monospace" font-size="12" fill="#6E7681">Grid.GitHub</text>
    <line x1="122" y1="433" x2="640" y2="433" stroke="#21262D" stroke-width="1" stroke-dasharray="3,7"/>
    <text x="840" y="437" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="12" fill="#58A6FF">@tengkuzainul</text>

    <text x="30" y="455" font-family="'Courier New', Courier, monospace" font-size="12" fill="#6E7681">Grid.Instagram</text>
    <line x1="144" y1="451" x2="640" y2="451" stroke="#21262D" stroke-width="1" stroke-dasharray="3,7"/>
    <text x="840" y="455" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="12" fill="#58A6FF">@tengkumz_</text>

    <text x="30" y="473" font-family="'Courier New', Courier, monospace" font-size="12" fill="#6E7681">Grid.TikTok</text>
    <line x1="120" y1="469" x2="640" y2="469" stroke="#21262D" stroke-width="1" stroke-dasharray="3,7"/>
    <text x="840" y="473" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="12" fill="#58A6FF">@bewokzcode__</text>

    <!-- Footer -->
    <line x1="20" y1="481" x2="840" y2="481" stroke="#21262D" stroke-width="1"/>
    <text x="30" y="488" font-family="'Courier New', Courier, monospace" font-size="10.5" fill="#39D353">&#9658; More about me &amp; projects below in README &#8595;</text>
    <!-- Blinking cursor -->
    <rect x="322" y="476" width="7" height="12" fill="#39D353">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- ══════════════════════════════════════════ -->
    <!-- SHIMMER SWEEP (over entire card)           -->
    <!-- ══════════════════════════════════════════ -->
    <rect x="-200" y="0" width="240" height="490" fill="url(#shimmer_t)" clip-path="url(#clip_t)">
      <animateTransform attributeName="transform" type="translate"
        values="-240,0; 1100,0; -240,0" dur="5s" keyTimes="0;0.5;1"
        calcMode="spline" keySplines="0.35,0,0.65,1;0.35,0,0.65,1"
        repeatCount="indefinite"/>
    </rect>
  </g>
</svg>

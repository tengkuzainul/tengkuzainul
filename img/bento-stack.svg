<svg width="520" height="320" viewBox="0 0 520 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_s" x1="0" y1="0" x2="520" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="1" stop-color="#161B22"/>
    </linearGradient>
    <!-- Top glow: JS Yellow → PHP Purple -->
    <linearGradient id="tg_s" x1="0" y1="0" x2="520" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#F7DF1E" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#F7DF1E" stop-opacity="0.9"/>
      <stop offset="0.75" stop-color="#777BB4" stop-opacity="0.9"/>
      <stop offset="1"    stop-color="#777BB4" stop-opacity="0"/>
    </linearGradient>
    <!-- Shimmer gradient (narrow sweep) -->
    <linearGradient id="shim_s" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="white" stop-opacity="0"/>
      <stop offset="0.5" stop-color="white" stop-opacity="0.07"/>
      <stop offset="1"   stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <!-- Clip card area for shimmer -->
    <clipPath id="clip_s">
      <rect width="520" height="300" rx="12"/>
    </clipPath>
    <!-- Shadow blur -->
    <filter id="shad_s" x="-30%" y="-30%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Animated shadow ellipse -->
  <ellipse cx="260" cy="312" rx="230" ry="10" fill="#000000" opacity="0.45" filter="url(#shad_s)">
    <animate attributeName="cy"      values="312;317;312" dur="4s" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4,0,0.6,1;0.4,0,0.6,1" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="ry"      values="10;5;10"     dur="4s" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4,0,0.6,1;0.4,0,0.6,1" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="opacity" values="0.45;0.18;0.45" dur="4s" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4,0,0.6,1;0.4,0,0.6,1" repeatCount="indefinite" begin="0.5s"/>
  </ellipse>

  <!-- Floating card wrapper -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 0,-5; 0,0" dur="4s" keyTimes="0;0.5;1"
      calcMode="spline" keySplines="0.4,0,0.6,1;0.4,0,0.6,1"
      repeatCount="indefinite" begin="0.5s"/>

    <!-- Card background -->
    <rect width="520" height="300" rx="12" fill="url(#bg_s)"/>
    <!-- Border -->
    <rect x="0.75" y="0.75" width="518.5" height="298.5" rx="11.5" fill="none" stroke="#30363D" stroke-width="1.5"/>
    <!-- Top accent glow -->
    <rect x="0" y="0" width="520" height="3" rx="1.5" fill="url(#tg_s)"/>

    <!-- Title bar -->
    <rect x="1" y="1" width="518" height="44" rx="11" fill="#161B22"/>
    <rect x="1" y="34" width="518" height="11" fill="#161B22"/>
    <line x1="1" y1="44" x2="519" y2="44" stroke="#21262D" stroke-width="1"/>

    <!-- Window controls -->
    <circle cx="24" cy="22" r="6" fill="#FF5F57"/>
    <circle cx="44" cy="22" r="6" fill="#FEBC2E"/>
    <circle cx="64" cy="22" r="6" fill="#28C840"/>

    <!-- Title -->
    <text x="260" y="27" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="13" fill="#6E7681">&#x26A1; TECH STACK</text>

    <!-- Vertical separator (label | badges) -->
    <line x1="102" y1="54" x2="102" y2="282" stroke="#21262D" stroke-width="1"/>

    <!-- ═══ ROW 1: LANGUAGE ═══ -->
    <text x="51" y="76" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10" fill="#8B949E">Language</text>
    <!-- PHP -->
    <rect x="112" y="62" width="42" height="22" rx="11" fill="#4F3B78"/>
    <rect x="112" y="62" width="42" height="22" rx="11" fill="none" stroke="#777BB4" stroke-width="1"/>
    <text x="133" y="77" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="#C3AEF7">PHP</text>
    <!-- JavaScript -->
    <rect x="162" y="62" width="82" height="22" rx="11" fill="#3A3000"/>
    <rect x="162" y="62" width="82" height="22" rx="11" fill="none" stroke="#F7DF1E" stroke-width="1"/>
    <text x="203" y="77" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="#F7DF1E">JavaScript</text>
    <!-- HTML -->
    <rect x="252" y="62" width="46" height="22" rx="11" fill="#7A1F0D"/>
    <rect x="252" y="62" width="46" height="22" rx="11" fill="none" stroke="#E34F26" stroke-width="1"/>
    <text x="275" y="77" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="#E8835E">HTML</text>
    <!-- CSS -->
    <rect x="306" y="62" width="40" height="22" rx="11" fill="#0A3860"/>
    <rect x="306" y="62" width="40" height="22" rx="11" fill="none" stroke="#1572B6" stroke-width="1"/>
    <text x="326" y="77" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="#4DA6FF">CSS</text>

    <!-- ═══ ROW 2: FRONTEND ═══ -->
    <text x="51" y="113" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10" fill="#8B949E">Frontend</text>
    <!-- Tailwind -->
    <rect x="112" y="99" width="96" height="22" rx="11" fill="#0B3040"/>
    <rect x="112" y="99" width="96" height="22" rx="11" fill="none" stroke="#06B6D4" stroke-width="1"/>
    <text x="160" y="114" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="#22D3EE">Tailwind CSS</text>
    <!-- Alpine.js -->
    <rect x="216" y="99" width="76" height="22" rx="11" fill="#1A2A33"/>
    <rect x="216" y="99" width="76" height="22" rx="11" fill="none" stroke="#8BC0D0" stroke-width="1"/>
    <text x="254" y="114" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="#8BC0D0">Alpine.js</text>

    <!-- ═══ ROW 3: BACKEND ═══ -->
    <text x="51" y="150" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10" fill="#8B949E">Backend</text>
    <!-- Laravel -->
    <rect x="112" y="136" width="66" height="22" rx="11" fill="#4A0700"/>
    <rect x="112" y="136" width="66" height="22" rx="11" fill="none" stroke="#FF2D20" stroke-width="1"/>
    <text x="145" y="151" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="#FF6B63">Laravel</text>
    <!-- Livewire -->
    <rect x="186" y="136" width="72" height="22" rx="11" fill="#3D0A2B"/>
    <rect x="186" y="136" width="72" height="22" rx="11" fill="none" stroke="#FB70A9" stroke-width="1"/>
    <text x="222" y="151" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="#FB70A9">Livewire</text>

    <!-- ═══ ROW 4: DATABASE ═══ -->
    <text x="51" y="187" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10" fill="#8B949E">Database</text>
    <!-- MySQL -->
    <rect x="112" y="173" width="56" height="22" rx="11" fill="#00242F"/>
    <rect x="112" y="173" width="56" height="22" rx="11" fill="none" stroke="#00758F" stroke-width="1"/>
    <text x="140" y="188" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="#00B3D4">MySQL</text>
    <!-- MariaDB -->
    <rect x="176" y="173" width="66" height="22" rx="11" fill="#001A22"/>
    <rect x="176" y="173" width="66" height="22" rx="11" fill="none" stroke="#0088CC" stroke-width="1"/>
    <text x="209" y="188" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="#7ECBEF">MariaDB</text>
    <!-- Supabase -->
    <rect x="250" y="173" width="72" height="22" rx="11" fill="#0A2A1A"/>
    <rect x="250" y="173" width="72" height="22" rx="11" fill="none" stroke="#3ECF8E" stroke-width="1"/>
    <text x="286" y="188" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="#3ECF8E">Supabase</text>

    <!-- ═══ ROW 5: TOOLS ═══ -->
    <text x="51" y="224" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="10" fill="#8B949E">Tools</text>
    <!-- Git -->
    <rect x="112" y="210" width="42" height="22" rx="11" fill="#4A1A0A"/>
    <rect x="112" y="210" width="42" height="22" rx="11" fill="none" stroke="#F05032" stroke-width="1"/>
    <text x="133" y="225" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="#F08060">Git</text>
    <!-- VS Code -->
    <rect x="162" y="210" width="68" height="22" rx="11" fill="#001A3A"/>
    <rect x="162" y="210" width="68" height="22" rx="11" fill="none" stroke="#007ACC" stroke-width="1"/>
    <text x="196" y="225" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="#4DA6FF">VS Code</text>
    <!-- Figma -->
    <rect x="238" y="210" width="54" height="22" rx="11" fill="#3A1200"/>
    <rect x="238" y="210" width="54" height="22" rx="11" fill="none" stroke="#F24E1E" stroke-width="1"/>
    <text x="265" y="225" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="#F77D5E">Figma</text>

    <!-- Footer separator -->
    <line x1="20" y1="248" x2="500" y2="248" stroke="#21262D" stroke-width="1"/>
    <!-- Footer text -->
    <text x="260" y="272" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="11" fill="#6E7681">&#x2014; TALL Stack Developer &#x26A1; &#x2014;</text>

    <!-- Shimmer sweep overlay -->
    <rect x="-200" y="0" width="200" height="300" fill="url(#shim_s)" clip-path="url(#clip_s)">
      <animateTransform attributeName="transform" type="translate"
        values="-200,0; 720,0; -200,0" dur="4s" keyTimes="0;0.5;1"
        calcMode="spline" keySplines="0.35,0,0.65,1;0.35,0,0.65,1"
        repeatCount="indefinite" begin="0.5s"/>
    </rect>
  </g>
</svg>
